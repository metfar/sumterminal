[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sumterminal"
version = "0.1.0a11"
description = "SUM terminal/session engine with graphical, drop-down and host frontends."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [{ name = "William Martinez Bas", email = "metfar@gmail.com" }]
dependencies = ["sumfsa>=0.1.0a1", "sumio>=0.1.0a1", "sumbash>=0.1.0a17", "sumgui>=0.2.0a24", "sumtui>=0.8.0a21", "sumkeyboard>=0.1.0a2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
]

[project.scripts]
sumterminal = "sumterminal.cli:main"
sumterm = "sumterminal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sumterminal*"]

[tool.pytest.ini_options]
pythonpath = ["src", "../../sumfsa/sumfsa/src", "../../sumio/sumio/src", "../../sumbash/sumbash/src", "../../sumcore/sumcore/src", "../../sumkeyboard/sumkeyboard/src", "../../sumui/sumui/src", "../../sumtui/sumtui/src", "../../sumgui/sumgui"]
testpaths = ["tests"]
